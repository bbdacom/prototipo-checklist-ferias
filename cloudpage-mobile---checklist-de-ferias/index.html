      if (ctls[i].hold !== null) { var h = ctls[i].hold; ctls[i].hold = null; ctlSet(ctls[i], h, true); }
    }
  }
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);

  // ---- árvore de camadas (um elemento por camada, com propriedades por estado) ----
  function make(n, parent, ctl) {
    var el = div('n', parent);
    el.style.opacity = 0; el.classList.add('gone');
    var o = { el: el, imgs: {}, vids: {}, n: n, kids: [], present: false, ctl: ctl, unit: null };

    if (n.u) {
      // componente interativo: tem a própria máquina de estados
      var inner = div('u', el);
      var uc = newCtl(inner, n.u.t.s.length);
      uc.root = make(n.u.t, inner, uc);
      o.unit = uc;
      ctlSet(uc, n.u.init || 0, false);
      return o;
    }

    var interactive = false;
    for (var i = 0; i < n.s.length; i++) {
      var p = n.s[i];
      if (!p) continue;
      if (p.img != null && !o.imgs[p.img]) {
        var im = D.createElement('img');
        im.alt = '';
        im.draggable = false;
        im.src = M.images[p.img];
        im.style.opacity = 0;
        el.appendChild(im);
        o.imgs[p.img] = im;
      }
      if (p.vid && !o.vids[p.vid]) {
        var src = videoUrl(p.vid);
        if (src) {
          var v = D.createElement('video');
          v.muted = true; v.defaultMuted = true; v.loop = true; v.autoplay = true; v.playsInline = true; v.controls = false;
          v.setAttribute('muted', ''); v.setAttribute('loop', ''); v.setAttribute('autoplay', '');
          v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
          v.preload = 'auto'; v.style.opacity = 0;
          v.addEventListener('error', function () { toast('Este navegador não conseguiu reproduzir um dos vídeos. Converta o arquivo para MP4 (H.264) e anexe de novo.'); });
          v.addEventListener('ended', function () { v.currentTime = 0; v.play(); });
          v.src = src;
          el.appendChild(v);
          o.vids[p.vid] = v;
          videos.push(v);
        }
      }
      if (p.rx) {
        for (var r = 0; r < p.rx.length; r++) {
          if (p.rx[r].t === 'AFTER_TIMEOUT') { if (ctl.timeouts[i]) ctl.timeouts[i].push(p.rx[r]); }
          else interactive = true;
        }
      }
    }
    if (interactive) bind(o);
    for (var j = 0; j < n.c.length; j++) o.kids.push(make(n.c[j], el, ctl));
    return o;
  }

  function setProps(o, p) {
    var s = o.el.style;
    s.left = px(p.x); s.top = px(p.y); s.width = px(p.w); s.height = px(p.h);
    o.el.classList.remove('gone');
    var r = p.r || [0, 0, 0, 0];
    s.borderRadius = px(r[0]) + ' ' + px(r[1]) + ' ' + px(r[2]) + ' ' + px(r[3]);
    s.backgroundColor = p.bg || 'rgba(0,0,0,0)';
    s.boxShadow = p.sh || 'none';
    s.overflow = p.clip ? 'hidden' : 'visible';
    var bf = p.bf ? 'blur(' + px(p.bf) + ')' : '';
    s.webkitBackdropFilter = bf; s.backdropFilter = bf;
    if (p.pb) { buildProgressive(o, p.pb, p.w, p.h); o.pbEl.style.display = ''; }
    else if (o.pbEl) o.pbEl.style.display = 'none';
    var hot = false;
    if (p.rx) for (var i = 0; i < p.rx.length; i++) if (p.rx[i].t !== 'AFTER_TIMEOUT') hot = true;
    s.pointerEvents = (hot || o.ctl.hoverO === o) ? 'auto' : '';
    s.cursor = hot ? 'pointer' : '';
    for (var k in o.imgs) o.imgs[k].style.opacity = (p.img != null && String(p.img) === k) ? 1 : 0;
    for (var vk in o.vids) { o.vids[vk].style.opacity = p.vid === vk ? 1 : 0; o.vids[vk].style.objectFit = p.vfit || 'cover'; }
  }

  function apply(o, si, animate) {
    var p = o.n.s[si];
    var el = o.el;
    if (!p) {
      if (!animate) el.classList.add('nt');
      el.style.opacity = 0;
      el.classList.add('gone');
      el.style.pointerEvents = '';
      if (!animate) { void el.offsetWidth; el.classList.remove('nt'); }
      o.present = false;
    } else if (!animate) {
      el.classList.add('nt');
      setProps(o, p); el.style.opacity = p.o;
      void el.offsetWidth; el.classList.remove('nt');
      o.present = true;
    } else {
      if (!o.present) {
        // camada que só existe no estado de destino: posiciona sem animar e faz dissolve
        el.classList.add('nt');
        setProps(o, p); el.style.opacity = 0;
        void el.offsetWidth; el.classList.remove('nt');
      } else {
        setProps(o, p);
      }
      el.style.opacity = p.o;
      o.present = true;
    }
    for (var i = 0; i < o.kids.length; i++) apply(o.kids[i], si, animate);
  }

  // ---- posicionamento das camadas de nível superior ----
  function host(L) {
    if (L.m === 'fixed') return fixedEl;
    if (L.m === 'sticky') {
      var rail = div('rail', pageEl);
      rail.style.top = px(L.y); rail.style.width = px(M.W);
      rail.style.height = px(Math.max(0, M.H - L.y));
      return div('stick', rail);
    }
    return pageEl;
  }

  // altura da tela do dispositivo escolhido, na escala do design
  function designH() { return M.deviceH * M.W / M.deviceW; }

  // Camada fixa: o que está na metade de cima da primeira tela ancora no topo;
  // o que está na metade de baixo (ou além da primeira tela) ancora na base.
  function fixedTop(L, h) {
    var Dh = designH();
    var within = L.y + L.h <= Dh + 0.5;
    var bottom;
    if (L.fa === 't') bottom = false;
    else if (L.fa === 'b') bottom = true;
    else bottom = within ? (L.y + L.h / 2 > Dh / 2 && L.h < Dh * 0.6) : true;
    if (!bottom) return L.y;
    var gap = within ? Dh - (L.y + L.h) : L.bottom;
    return Hd - gap - h;
  }
  function baseTop(L, h) {
    if (L.m === 'fixed') return fixedTop(L, h);
    if (L.m === 'sticky') return L.ab ? (L.h - h) : 0;
    return L.ab ? (L.y + L.h - h) : L.y;
  }
  function baseLeft(L, w) {
    if (L.ax === 'c') return L.x + (L.w - w) / 2;
    if (L.ax === 'r') return L.x + (L.w - w);
    return L.x;
  }

  var placed = [];   // camadas estáticas
  var slot = null;   // camada que alterna

  function placeWrap(wrap, L, w, h, animate) {
    if (!animate) wrap.classList.add('nt');
    wrap.style.left = px(baseLeft(L, w)); wrap.style.top = px(baseTop(L, h));
    wrap.style.width = px(w); wrap.style.height = px(h);
    if (!animate) { void wrap.offsetWidth; wrap.classList.remove('nt'); }
  }

  for (var i = 0; i < M.layers.length; i++) {
    (function (L) {
      var wrap = div('n', host(L));
      var ctl = newCtl(wrap, L.t.s.length);
      ctl.root = make(L.t, wrap, ctl);
      if (L.slot) {
        ctl.onSet = function (si, animate) {
          var S = L.states[si];
          placeWrap(wrap, L, S.w, S.h, animate);
        };
        slot = { L: L, wrap: wrap, ctl: ctl, cur: 0, ghost: null };
      } else {
        placed.push({ L: L, wrap: wrap, ctl: ctl });
      }
    })(M.layers[i]);
  }

  function slotPlace() {
    if (!slot) return;
    var C = slot.L.states[slot.cur];
    placeWrap(slot.wrap, slot.L, C.w, C.h, false);
  }
  function dropGhost() {
    if (slot && slot.ghost) { if (slot.ghost.parentNode) slot.ghost.parentNode.removeChild(slot.ghost); slot.ghost = null; }
    if (slot && slot.fadeIn) { try { slot.fadeIn.cancel(); } catch (e) {} slot.fadeIn = null; }
  }
  // A animação pertence à fronteira entre dois estados: entre o estado k-1 e o k vale a configuração do k,
  // tanto na ida (rolando para baixo) quanto na volta (rolando para cima).
  function animOf(from, to) {
    var S = slot.L.states[Math.max(from, to)];
    return { a: S.a || M.anim || 'smart', d: S.d != null ? S.d : M.dur, e: EASE[S.e || M.ease] || EASE['ease-out'], dl: S.dl != null ? S.dl : (M.delay || 0) };
  }
  function slotSet(i, animate) {
    if (!slot) return;
    var T = animOf(slot.cur, i);
    dropGhost();
    slot.cur = i;
    if (!animate || T.a === 'none' || !T.d) { ctlSet(slot.ctl, i, false); return; }
    if (T.a === 'fade' && slot.wrap.animate) {
      // dissolve: uma cópia parada do estado anterior some enquanto o novo estado aparece no lugar
      var g = slot.wrap.cloneNode(true);
      g.classList.add('gone');
      slot.wrap.parentNode.insertBefore(g, slot.wrap.nextSibling);
      slot.ghost = g;
      ctlSet(slot.ctl, i, false);
      var opt = { duration: T.d, easing: T.e, fill: 'both' };
      var out = g.animate([{ opacity: 1 }, { opacity: 0 }], opt);
      slot.fadeIn = slot.wrap.animate([{ opacity: 0 }, { opacity: 1 }], { duration: T.d, easing: T.e });
      out.onfinish = function () { if (slot.ghost === g) dropGhost(); };
      return;
    }
    slot.wrap.style.setProperty('--d', T.d + 'ms');
    slot.wrap.style.setProperty('--e', T.e);
    ctlSet(slot.ctl, i, true);
  }

  function pick(y) {
    var idx = 0;
    if (!slot) return 0;
    var S = slot.L.states;
    for (var i = 0; i < S.length; i++) if (y >= S[i].at) idx = i;
    return idx;
  }

  // ---- HUD opcional ----
  var hud = null;
  if (M.hud) { hud = D.createElement('div'); hud.id = 'hud'; D.body.appendChild(hud); }
  function drawHud(y) {
    if (!hud || !slot) return;
    var S = slot.L.states, cur = slot.cur;
    hud.textContent = 'rolagem: ' + Math.round(y) + 'px · ' + (cur + 1) + '/' + S.length + ' ' + S[cur].name;
  }

  // ---- tela / escala ----
  var ready = false;
  function layout() {
    var vw = window.innerWidth, vh = window.innerHeight, s;
    var touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    if (M.full || (touch && vw <= 900)) {
      // tela cheia (ou celular): ocupa 100% da janela, ajustando pela largura
      s = vw / M.W; Hd = vh / s;
      device.classList.remove('frame');
    } else {
      // no computador: moldura do dispositivo escolhido
      Hd = designH();
      s = Math.min(M.deviceW / M.W, (vh - 32) / Hd, (vw - 32) / M.W);
      device.classList.add('frame');
    }
    device.style.width = px(M.W); device.style.height = px(Hd);
    device.style.transform = 'scale(' + s + ')';
    scaleNow = s;
    device.style.left = px((vw - M.W * s) / 2);
    device.style.top = px((vh - Hd * s) / 2);
    if (!ready) return;
    for (var i = 0; i < placed.length; i++) placeWrap(placed[i].wrap, placed[i].L, placed[i].L.w, placed[i].L.h, false);
    slotPlace();
  }

  pageEl.style.width = px(M.W); pageEl.style.height = px(M.H);
  pageEl.style.background = M.bg; device.style.background = M.bg;
  fixedEl.style.width = px(M.W);

  layout();
  for (var k = 0; k < placed.length; k++) {
    placeWrap(placed[k].wrap, placed[k].L, placed[k].L.w, placed[k].L.h, false);
    ctlSet(placed[k].ctl, 0, false);
  }
  slotSet(pick(0), false);
  ready = true;
  playAll();
  window.addEventListener('pointerdown', playAll, { once: true });
  window.addEventListener('touchend', playAll, { once: true });
  D.addEventListener('visibilitychange', function () { if (!D.hidden) playAll(); });
  drawHud(0);

  var ticking = false, want = slot ? slot.cur : 0, delayTimer = null;
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      ticking = false;
      var y = scroller.scrollTop;
      if (slot) {
        var i = pick(y);
        if (i !== want) {
          want = i;
          clearTimeout(delayTimer);
          var wait = animOf(slot.cur, i).dl;
          if (wait > 0) delayTimer = setTimeout(function () { if (want !== slot.cur) slotSet(want, true); }, wait);
          else if (i !== slot.cur) slotSet(i, true);
        }
      }
      drawHud(y);
    });
  }
  scroller.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', layout);

  // troca de dispositivo pelo preview do plugin
  window.addEventListener('message', function (e) {
    var d = e.data && e.data.scrollSwapDevice;
    if (d && d.w > 0 && d.h > 0) { M.deviceW = d.w; M.deviceH = d.h; M.full = d.full ? 1 : 0; layout(); }
  });

  window.__scrollSwap = { model: M, state: function () { return slot ? slot.cur : 0; }, scroller: scroller, ctls: ctls };
})();
</script>
</body>
</html>
